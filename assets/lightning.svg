<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="lightningGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bolt {
      fill: none;
      stroke: #ffff00;
      stroke-width: 2;
      filter: url(#lightningGlow2);
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: flash 1.5s infinite linear;
    }
    
    @keyframes flash {
      0% { stroke-dashoffset: 200; stroke: #ffff00; }
      50% { stroke-dashoffset: 0; stroke: #00ffff; }
      100% { stroke-dashoffset: -200; stroke: #ffff00; }
    }
  </style>

  <path d="M 0 25 L 40 10 L 80 40 L 120 15 L 160 35 L 200 25" class="bolt" />
</svg>
